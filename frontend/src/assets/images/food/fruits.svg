<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#122E22" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Crate Basket -->
  <rect x="220" y="180" width="360" height="240" rx="20" fill="#8C6E4B" stroke="#D4A72C" stroke-width="4" />
  <!-- Fruit Spheres -->
  <circle cx="300" cy="260" r="45" fill="#DC2626" /> <!-- Red Apple -->
  <circle cx="400" cy="250" r="50" fill="#EAB308" /> <!-- Yellow Mango -->
  <circle cx="500" cy="270" r="45" fill="#EA580C" /> <!-- Orange -->
  <circle cx="340" cy="330" r="40" fill="#16A34A" /> <!-- Green Apple -->
  <circle cx="460" cy="330" r="45" fill="#DC2626" /> <!-- Red Apple -->
  <circle cx="400" cy="340" r="35" fill="#EAB308" /> <!-- Lemon -->
  <!-- Label Overlay -->
  <rect x="250" y="490" width="300" height="50" rx="25" fill="#1B4332" opacity="0.95" stroke="#D4A72C" stroke-width="2" />
  <text x="400" y="522" text-anchor="middle" fill="#FBF9F4" font-family="serif" font-size="20" font-weight="bold">Fresh Seasonal Fruits</text>
</svg>
