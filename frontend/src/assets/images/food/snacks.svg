<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Plate -->
  <circle cx="400" cy="300" r="190" fill="#FBF9F4" stroke="#D4A72C" stroke-width="6" />
  <!-- Sandwich Triangles -->
  <polygon points="260,340 400,200 400,340" fill="#E8C766" stroke="#8C6E4B" stroke-width="3" />
  <polygon points="400,340 400,200 540,340" fill="#E8C766" stroke="#8C6E4B" stroke-width="3" />
  <!-- Fillings -->
  <line x1="260" y1="340" x2="540" y2="340" stroke="#16A34A" stroke-width="8" stroke-linecap="round" />
  <line x1="280" y1="330" x2="520" y2="330" stroke="#DC2626" stroke-width="6" stroke-linecap="round" />
  <!-- Label Overlay -->
  <rect x="250" y="490" width="300" height="50" rx="25" fill="#1B4332" opacity="0.95" stroke="#D4A72C" stroke-width="2" />
  <text x="400" y="522" text-anchor="middle" fill="#FBF9F4" font-family="serif" font-size="20" font-weight="bold">Fresh Garden Snacks</text>
</svg>
