<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#0B1A13" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E5C8" />
      <stop offset="100%" stop-color="#D4A72C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Bowl Outer Shadow & Bowl Base -->
  <circle cx="400" cy="300" r="210" fill="#122E22" filter="url(#shadow)" />
  <circle cx="400" cy="300" r="200" fill="#EFEAE0" stroke="#D4A72C" stroke-width="8" />
  <!-- Biryani Base -->
  <circle cx="400" cy="300" r="180" fill="url(#riceGrad)" />
  <!-- Garnish & Rice Grains -->
  <circle cx="360" cy="270" r="45" fill="#8C6E4B" opacity="0.8" />
  <circle cx="440" cy="330" r="40" fill="#2D6A4F" opacity="0.8" />
  <circle cx="330" cy="340" r="35" fill="#C27D0E" opacity="0.9" />
  <circle cx="450" cy="260" r="30" fill="#40704A" opacity="0.8" />
  <!-- Spices & Herbs Garnish -->
  <path d="M370 240 Q400 210 430 240 Q400 270 370 240 Z" fill="#1B4332" />
  <circle cx="400" cy="300" r="15" fill="#D4A72C" />
  <!-- Label Overlay -->
  <rect x="250" y="490" width="300" height="50" rx="25" fill="#1B4332" opacity="0.95" stroke="#D4A72C" stroke-width="2" />
  <text x="400" y="522" text-anchor="middle" fill="#FBF9F4" font-family="serif" font-size="20" font-weight="bold">Vegetable Biryani</text>
</svg>
