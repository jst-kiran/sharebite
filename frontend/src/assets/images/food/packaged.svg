  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Sealed Cereal & Goods Boxes -->
  <rect x="230" y="180" width="140" height="220" rx="12" fill="#EFEAE0" stroke="#D4A72C" stroke-width="4" />
  <rect x="400" y="160" width="160" height="240" rx="12" fill="#40704A" stroke="#E8C766" stroke-width="4" />
